version: '3.8'

# =============================================================================
# ARQUITECTURA DISTRIBUIDA: INSTANCIA AWS EC2 4 - CLÚSTER APACHE KAFKA
# IP Elástica Asignada: 54.84.199.244
# Diseñado para servidor AWS EC2 t3.small (2 vCPU / 2GB RAM) con Heap Estricto (~768 MB total)
# =============================================================================

services:
  # ── 1. ZooKeeper Quórum ──────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: kafka-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xmx128M -Xms128M -XX:+UseG1GC"
    ports:
      - "2181:2181"
    networks:
      - kafka-cluster-net

  # ── 2. Kafka Broker 1 ────────────────────────────────────────────────────────
  kafka-1:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka-broker-1
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://${HOST_IP:-54.84.199.244}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 33554432
      KAFKA_LOG_RETENTION_HOURS: 168
    networks:
      - kafka-cluster-net

  # ── 3. Kafka Broker 2 ────────────────────────────────────────────────────────
  kafka-2:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka-broker-2
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://${HOST_IP:-54.84.199.244}:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 33554432
      KAFKA_LOG_RETENTION_HOURS: 168
    networks:
      - kafka-cluster-net

  # ── 4. Consola Gráfica Kafka-UI ──────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-dashboard
    restart: unless-stopped
    depends_on:
      - kafka-1
      - kafka-2
    ports:
      - "8080:8080" # Acceso Web en http://54.84.199.244:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360-aws-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      JAVA_OPTS: "-Xmx128m -Xms128m"
    networks:
      - kafka-cluster-net

networks:
  kafka-cluster-net:
    driver: bridge
